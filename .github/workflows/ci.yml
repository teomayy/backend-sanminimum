name: CI

on:
  push:
    branches: [main]
  pull_request:

# Отменяем устаревшие прогоны для той же ветки/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      # --ignore-scripts: пропускаем нативную сборку canvas (в CI не нужна —
      # тесты его не импортируют, а tsc использует только типы)
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      # Без --fix: CI должен проверять, а не молча править код
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build (typecheck)
        run: yarn build

      - name: Unit tests
        run: yarn test

      - name: E2E tests
        run: yarn test:e2e
